name: "GhostWire Android Build"

on:
  workflow_dispatch:
  push:
    branches:
      - develop

jobs:
  build:
    name: GhostWire runner probe
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub-hosted runner
        run: |
          echo "GhostWire runner started"
          java -version || true
