name: "GhostWire Android Build"

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: ghostwire-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GhostWire Alpha Compat APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build unsigned Alpha Compat APK
        env:
          ENABLE_SIGNING: "false"
        run: ./gradlew app:assembleAlphaCompat --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: GhostWire-Alpha-Compat-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
